<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · audit</title><style>body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{max-width:900px;margin:auto}h1{font:46px Georgia,serif;color:#051a0f}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}.panel{margin-top:28px;background:#fff;border:1px solid #d9d1c7}.event{padding:18px;border-bottom:1px solid #d9d1c7}.event:last-child{border-bottom:0}.event strong{color:#051a0f}.muted{color:#737973;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#79564f}</style></head><body><main><span class="eyebrow">CRM · governance</span><h1>Historia de actividad</h1><p class="muted">Registro de desarrollo. En producción debe ser persistente, inmutable y ligado a una identidad autenticada.</p><section class="panel" id="events">Cargando…</section></main><script>async function load(){const target=document.querySelector('#events');try{const response=await fetch('http://127.0.0.1:8797/api/audit-events',{cache:'no-store'});if(!response.ok)throw new Error('API '+response.status);const data=await response.json();target.innerHTML=data.events?.length?data.events.map((e,i)=>`<article class="event"><strong>Evento ${i+1}</strong><div class="muted">${JSON.stringify(e.payload,null,2)}</div></article>`).join(''):'<article class="event">No hay eventos en esta sesión.</article>'}catch(error){target.innerHTML=`<article class="event error">No se pudo cargar la auditoría: ${error.message}</article>`}}load()</script></body></html>
