<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · calendar</title><style>*{box-sizing:border-box}body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{max-width:1050px;margin:auto}h1{font:46px Georgia,serif;color:#051a0f}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.action{border:1px solid #d9d1c7;background:#fff;padding:10px 14px;color:#051a0f;text-decoration:none;cursor:pointer}.tabs button.active{background:#051a0f;color:#fff}.row{display:grid;grid-template-columns:80px 1fr 170px 140px 180px;background:#fff;border:1px solid #d9d1c7;border-bottom:0;padding:18px;gap:14px;align-items:center}.row:last-child{border-bottom:1px solid #d9d1c7}.muted{color:#737973;font-size:13px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#79564f}.actions{display:flex;gap:6px;flex-wrap:wrap}.action{font-size:12px;padding:7px 9px}.empty{padding:24px;background:#fff;border:1px solid #d9d1c7;color:#737973}@media(max-width:800px){body{padding:24px}.row{grid-template-columns:70px 1fr}.row .tag,.row .muted,.row .actions{grid-column:2}}</style></head><body><main><span class="tag">CRM · ecosistemas de atención</span><h1>Calendario de Gosia</h1><p class="muted">Datos sintéticos. Filtra por ecosistema sin mezclar los flujos de trabajo.</p><a class="action" href="appointment-create.html">+ Nueva cita</a><div class="tabs" id="tabs"></div><section id="list"></section></main><script src="api-client.js"></script><script>(async()=>{const result=await OnkofizjoApi.get('/api/appointments','data/demo-appointments.json');const all=result.data.appointments||[];const tabs=['ALL','ONCOLOGY_REHAB','LYMPHATIC_THERAPY','PHYSIOTHERAPY','DIETETICS','MASSAGE','HOME_VISIT'];let selected='ALL';const draw=()=>{document.querySelector('#tabs').innerHTML=tabs.map(t=>`<button class="${t===selected?'active':''}" data-tab="${t}">${t.replaceAll('_',' ')}</button>`).join('');const rows=all.filter(a=>selected==='ALL'||a.ecosystem===selected);document.querySelector('#list').innerHTML=rows.length?rows.map(a=>`<div class="row"><strong>${a.start.slice(11,16)}</strong><div><strong>${a.patient}</strong><div class="muted">${a.service}</div><div class="muted">${a.status||'SCHEDULED'}</div></div><div class="tag">${a.ecosystem.replaceAll('_',' ')}</div><div class="muted">${a.location.replaceAll('_',' ')}</div><div class="actions"><a class="action" href="appointment-status.html?appointmentId=${a.id}">Estado</a><a class="action" href="patient.html">Paciente</a><a class="action" href="teleconsult.html?appointmentId=${a.id}">Teleconsulta</a></div></div>`).join(''):'<div class="empty">No hay citas en este ecosistema.</div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{selected=b.dataset.tab;draw()})};draw()})()</script></body></html>
