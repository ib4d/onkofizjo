<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · calendar</title><style>body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}h1{font:46px Georgia,serif;color:#051a0f}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{border:1px solid #d9d1c7;background:#fff;padding:10px 14px}.tabs button.active{background:#051a0f;color:#fff}.row{display:grid;grid-template-columns:80px 1fr 180px 150px;background:#fff;border:1px solid #d9d1c7;border-bottom:0;padding:18px;gap:14px}.row:last-child{border-bottom:1px solid #d9d1c7}.muted{color:#737973;font-size:13px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#79564f}@media(max-width:700px){.row{grid-template-columns:70px 1fr}.row .tag{grid-column:2}.row .muted{grid-column:2}}</style></head><body><span class="tag">CRM · ecosistemas de atención</span><h1>Calendario de Gosia</h1><p class="muted">Datos sintéticos. Filtra por ecosistema sin mezclar los flujos de trabajo.</p><div class="tabs" id="tabs"></div><section id="list"></section><script src="api-client.js"></script><script>(async()=>{const result=await OnkofizjoApi.get('/api/appointments','data/demo-appointments.json');const all=result.data.appointments;const tabs=['ALL','ONCOLOGY_REHAB','LYMPHATIC_THERAPY','PHYSIOTHERAPY','DIETETICS','MASSAGE','HOME_VISIT'];let selected='ALL';const draw=()=>{document.querySelector('#tabs').innerHTML=tabs.map(t=>`<button class="${t===selected?'active':''}" data-tab="${t}">${t.replaceAll('_',' ')}</button>`).join('');document.querySelector('#list').innerHTML=all.filter(a=>selected==='ALL'||a.ecosystem===selected).map(a=>`<div class="row"><strong>${a.start.slice(11,16)}</strong><div><strong>${a.patient}</strong><div class="muted">${a.service}</div></div><div class="tag">${a.ecosystem.replaceAll('_',' ')}</div><div class="muted">${a.location.replaceAll('_',' ')}</div></div>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{selected=b.dataset.tab;draw()})};draw()})()</script></body></html>
