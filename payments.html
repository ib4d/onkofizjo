<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · payments</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Literata:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg:#fdf9f5;--green:#051a0f;--ink:#1c1c19;--line:#d9d1c7;--gold:#bd9b60}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.bar{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f7f3ef}.brand{font:28px Literata,Georgia,serif;color:var(--gold)}main{max-width:1120px;margin:auto;padding:64px 5vw}h1{font:48px Literata,Georgia,serif;color:var(--green);margin:12px 0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:36px 0}.card,.row{background:#fff;border:1px solid var(--line);padding:22px;border-radius:6px}.card strong{display:block;font:28px Literata,Georgia,serif;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr 120px 130px;gap:14px;align-items:center;border-radius:0;border-bottom:0}.row:last-child{border-bottom:1px solid var(--line)}.muted{color:#737973;font-size:13px}.status{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}@media(max-width:700px){.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .status{grid-column:span 2}}
</style></head><body><header class="bar"><div class="brand">onkofizjo</div><a href="product-hub.html">← Product preview</a></header><main><span class="eyebrow">CRM · rozliczenia</span><h1>Płatności i faktury</h1><p class="muted">Widok demonstracyjny oparty na danych syntetycznych. W produkcji każda zmiana będzie audytowana.</p><section class="summary"><div class="card"><span class="muted">Dzisiaj</span><strong>370 zł</strong></div><div class="card"><span class="muted">Opłacone wizyty</span><strong>1</strong></div><div class="card"><span class="muted">Faktury do przygotowania</span><strong>1</strong></div></section><section id="rows"></section></main><script src="operations-data-bridge.js"></script><script>(async()=>{const d=await fetch('data/demo-operations.json').then(r=>r.json());document.querySelector('#rows').innerHTML=d.payments.map(p=>`<div class="row"><div><strong>${p.patient}</strong><div class="muted">${p.method}</div></div><div>${p.amount} ${p.currency}<div class="muted">${p.receiptOrInvoice}</div></div><div class="status">${p.status}</div><div class="muted">Demo record</div></div>`).join('')})()</script></body></html>
