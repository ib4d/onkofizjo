<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · teleconsulta</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif;padding:32px}main{max-width:900px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#79564f}h1{font:clamp(42px,7vw,72px) Georgia,serif;color:#051a0f;margin:12px 0}.lead{color:#4d514e;line-height:1.6}.card{background:#fff;border:1px solid #d9d1c7;padding:22px;border-radius:12px;margin-top:20px}label{display:block;font-weight:700;margin:14px 0 6px}select{width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5}.btn{background:#051a0f;color:#fff;padding:13px 17px;border:0;border-radius:6px;font-weight:700;cursor:pointer;margin:12px 8px 0 0}.btn.alt{background:#fff;color:#051a0f;border:1px solid #051a0f}.muted{font-size:13px;color:#737973;line-height:1.5}.notice{padding:12px;background:#f1ede9;margin-top:16px}.result{white-space:pre-wrap;background:#f1ede9;padding:14px;margin-top:18px}.video{display:none;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.video video{width:100%;background:#051a0f;border-radius:8px;min-height:180px}@media(max-width:640px){body{padding:18px}.video{grid-template-columns:1fr}.btn{width:100%;margin-right:0}}</style></head><body><main><span class="eyebrow">CRM · remote care</span><h1>Teleconsulta con contexto.</h1><p class="lead">Selecciona el paciente y la cita. El vídeo requiere consentimiento explícito; la grabación está desactivada. La llamada telefónica queda como alternativa.</p><section class="card"><label>Paciente<select id="patientId"><option value="">Selecciona un paciente</option></select></label><label>Cita<select id="appointmentId"><option value="">Selecciona una cita</option></select></label><label class="notice"><input type="checkbox" id="consent"> Confirmo que existe consentimiento para la teleconsulta por vídeo. No se grabará.</label><button class="btn" id="video">Preparar videollamada</button><button class="btn alt" id="phone">Iniciar alternativa telefónica</button><div class="video" id="videoPanel"><div><p class="muted">Vista previa local · no se transmite todavía</p><video id="preview" autoplay muted playsinline></video></div><div><p class="muted">Estado de sesión</p><div class="result" id="sessionState">READY</div><button class="btn" id="end">Finalizar sesión</button><button class="btn alt" id="cancel">Cancelar</button></div></div><div class="result" id="status">Cargando contexto…</div></section></main><script src="api-client.js"></script><script>
const params=new URLSearchParams(location.search),patient=document.querySelector('#patientId'),appointment=document.querySelector('#appointmentId'),status=document.querySelector('#status'),consent=document.querySelector('#consent'),panel=document.querySelector('#videoPanel'),preview=document.querySelector('#preview'),sessionState=document.querySelector('#sessionState');let appointments=[],teleId=null,stream=null;
async function load(){try{const [p,a]=await Promise.all([OnkofizjoApi.get('/api/patients','data/demo-patients.json'),OnkofizjoApi.get('/api/appointments','data/demo-appointments.json')]);(p.data.patients||[]).forEach(x=>patient.add(new Option(`${x.name} · ${x.ecosystem}`,x.id)));appointments=a.data.appointments||[];if(params.get('patientId'))patient.value=params.get('patientId');draw();status.textContent='Contexto listo · datos sintéticos.'}catch(e){status.textContent='No se pudo cargar el contexto: '+e.message}}function draw(){appointment.innerHTML='<option value="">Selecciona una cita</option>';appointments.filter(x=>!patient.value||x.patientId===patient.value).forEach(x=>appointment.add(new Option(`${x.id} · ${x.service} · ${x.status}`,x.id)));if(params.get('appointmentId'))appointment.value=params.get('appointmentId')}patient.onchange=draw;
async function start(mode){if(!patient.value){status.textContent='Selecciona un paciente.';return}if(mode==='VIDEO'&&!consent.checked){status.textContent='Consentimiento requerido antes de preparar el vídeo.';return}try{const r=await OnkofizjoApi.post('/api/teleconsultations',{patientId:patient.value,appointmentId:appointment.value||undefined,mode,consent:consent.checked,state:mode==='VIDEO'?'READY':'RINGING',role:'GOSIA'});const d=r.data;teleId=d.id;sessionState.textContent=d.status+' · '+d.provider;if(mode==='PHONE'){status.innerHTML=`Llamada registrada como ${d.status}. <a href="${d.phoneAction}">Llamar a ${patient.options[patient.selectedIndex].text}</a>`;return}panel.style.display='grid';try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});preview.srcObject=stream;sessionState.textContent='READY · cámara y micrófono disponibles'}catch(e){sessionState.textContent='READY · permisos no concedidos; usar teléfono';status.textContent='No se obtuvo cámara/micrófono. Elige la alternativa telefónica.'}status.textContent='Sala demo preparada. Proveedor externo pendiente de configuración.'}catch(e){status.textContent='No se pudo preparar la teleconsulta: '+e.message}}
async function finish(state){if(!teleId)return;try{const r=await OnkofizjoApi.post('/api/teleconsultations',{teleconsultationId:teleId,patientId:patient.value,appointmentId:appointment.value||undefined,mode:'VIDEO',consent:true,state,role:'GOSIA'});sessionState.textContent=r.data.status;status.textContent=state==='ENDED'?'Sesión finalizada y auditada.':'Sesión cancelada y auditada.'}catch(e){status.textContent='No se pudo actualizar la sesión: '+e.message}if(stream){stream.getTracks().forEach(t=>t.stop());preview.srcObject=null}panel.style.display='none'}document.querySelector('#video').onclick=()=>start('VIDEO');document.querySelector('#phone').onclick=()=>start('PHONE');document.querySelector('#end').onclick=()=>finish('ENDED');document.querySelector('#cancel').onclick=()=>finish('CANCELLED');load();
</script></body></html>
