<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · teleconsultation</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif;padding:32px}main{max-width:900px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#79564f}h1{font:clamp(42px,7vw,72px) Georgia,serif;color:#051a0f;margin:12px 0}.lead{color:#4d514e;line-height:1.6}.card{background:#fff;border:1px solid #d9d1c7;padding:22px;border-radius:12px;margin-top:20px}label{display:block;font-weight:700;margin:14px 0 6px}select{width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5}.btn{background:#051a0f;color:#fff;padding:13px 17px;border:0;border-radius:6px;font-weight:700;cursor:pointer;margin:12px 8px 0 0}.muted{font-size:13px;color:#737973;line-height:1.5}.result{white-space:pre-wrap;background:#f1ede9;padding:14px;margin-top:18px}</style></head><body><main><span class="eyebrow">CRM · remote care</span><h1>Teleconsulta con contexto.</h1><p class="lead">Selecciona el paciente y la cita del CRM. La videollamada requiere consentimiento y no se graba por defecto.</p><section class="card"><label>Paciente<select id="patientId"><option value="">Selecciona un paciente</option></select></label><label>Cita<select id="appointmentId"><option value="">Selecciona una cita</option></select></label><button class="btn" id="video">Preparar videollamada</button><button class="btn" id="phone">Registrar llamada</button><div class="result" id="status">Cargando contexto…</div></section></main><script>const base='http://127.0.0.1:8797',params=new URLSearchParams(location.search),patient=document.querySelector('#patientId'),appointment=document.querySelector('#appointmentId'),status=document.querySelector('#status');let appointments=[];Promise.all([fetch(base+'/api/patients').then(r=>r.json()),fetch(base+'/api/appointments').then(r=>r.json())]).then(([p,a])=>{(p.patients||[]).forEach(x=>patient.add(new Option(`${x.name} · ${x.ecosystem}`,x.id)));appointments=a.appointments||[];const requestedPatient=params.get('patientId');if(requestedPatient)patient.value=requestedPatient;const draw=()=>{appointment.innerHTML='<option value="">Selecciona una cita</option>';appointments.filter(x=>!patient.value||x.patientId===patient.value).forEach(x=>appointment.add(new Option(`${x.id} · ${x.service} · ${x.status}`,x.id)));const requested=params.get('appointmentId');if(requested)appointment.value=requested)};patient.onchange=draw;draw();status.textContent='Contexto listo.'}).catch(()=>status.textContent='No se pudo cargar el contexto.');async function start(mode){try{const r=await fetch(base+'/api/teleconsultations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId:patient.value,appointmentId:appointment.value,mode,role:'GOSIA'})});status.textContent=JSON.stringify(await r.json(),null,2)}catch(error){status.textContent='No se pudo iniciar la teleconsulta: '+error.message}}document.querySelector('#video').onclick=()=>start('VIDEO');document.querySelector('#phone').onclick=()=>start('PHONE');</script></body></html>
