<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · knowledge</title><style>body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{max-width:980px;margin:auto}h1{font:46px Georgia,serif;color:#051a0f}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.card{background:#fff;border:1px solid #d9d1c7;padding:20px;min-height:180px}.kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#79564f}.card h3{font:22px Georgia,serif;color:#051a0f}.muted{color:#737973;font-size:13px;line-height:1.5}.status{margin-top:20px;color:#051a0f;font-weight:700;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main><span class="eyebrow">Hermes · knowledge base</span><h1>Fuentes que se pueden verificar.</h1><p class="muted">La experiencia de Gosia y la evidencia externa se mantienen separadas. Una sugerencia sin fuente verificada debe detenerse para revisión.</p><section class="grid" id="items">Loading…</section></main><script>fetch('http://127.0.0.1:8793/api/knowledge').then(r=>r.json()).then(d=>{document.querySelector('#items').innerHTML=d.items.map(x=>`<article class="card"><div class="kind">${x.kind.replaceAll('_',' ')}</div><h3>${x.title}</h3><div class="muted">${x.area}</div><div class="status">${x.status}</div><div class="muted">Source: ${x.source}</div></article>`).join('')})</script></body></html>
