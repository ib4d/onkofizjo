<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · new appointment</title><style>body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;background:#fff;border:1px solid #d9d1c7;padding:28px}h1{font:42px Georgia,serif;color:#051a0f}label{display:block;font-weight:700;margin:18px 0 7px}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5}button{margin-top:22px;background:#051a0f;color:#fff;border:0;padding:14px 18px;font-weight:700}.result{margin-top:18px;padding:15px;background:#f1ede9;white-space:pre-wrap;line-height:1.5}</style></head><body><main><small>CRM · agenda</small><h1>Nowa wizyta</h1><p>Demo operacyjna. Tworzy wizytę wewnętrzną.</p><form id="form"><label>Pacjent<input name="patient" value="Anna Kowalska" required></label><label>Ecosystem<select name="ecosystem"><option>LYMPHATIC_THERAPY</option><option>ONCOLOGY_REHAB</option><option>PHYSIOTHERAPY</option><option>DIETETICS</option><option>MASSAGE</option><option>HOME_VISIT</option></select></label><label>Lokalizacja<select name="location"><option>28 CZERWCA</option><option>SOWMED_KOSCIELNA</option><option>AMAZONKI</option><option>HOME</option></select></label><label>Usługa<input name="service" value="Initial consultation" required></label><label>Start<input name="start" type="datetime-local" value="2026-08-13T16:00" required></label><button>Utwórz wizytę</button></form><div class="result" id="result">Ready.</div></main><script>const base='http://127.0.0.1:8797';const form=document.querySelector('#form');const patientInput=form.elements.patient;const id=new URLSearchParams(location.search).get('patientId');if(id)fetch(base+'/api/patients').then(r=>r.json()).then(d=>{const p=(d.patients||[]).find(x=>x.id===id);if(p){patientInput.value=p.name;patientInput.dataset.patientId=p.id}});form.onsubmit=async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(form));payload.patientId=patientInput.dataset.patientId||id||'';payload.actor='demo-gosia';try{const r=await fetch(base+'/api/appointments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2)}catch(error){document.querySelector('#result').textContent='Unable to create appointment: '+error.message}}</script></body></html>
