<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · new appointment</title><style>body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;background:#fff;border:1px solid #d9d1c7;padding:28px}h1{font:42px Georgia,serif;color:#051a0f}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}label{display:block;font-weight:700;margin:18px 0 7px}input,select{width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5}button{margin-top:22px;background:#051a0f;color:#fff;border:0;padding:14px 18px;font-weight:700}.result{margin-top:18px;padding:15px;background:#f1ede9;white-space:pre-wrap;line-height:1.5}</style></head><body><main><span class="eyebrow">CRM · agenda</span><h1>Nowa wizyta</h1><p>Demo operacyjna. Tworzy wizytę wewnętrzną, nie publiczną prośbę pacjenta.</p><form id="form"><label>Pacjent<input name="patient" value="Anna Kowalska" required></label><label>Ecosystem<select name="ecosystem"><option>LYMPHATIC_THERAPY</option><option>ONCOLOGY_REHAB</option><option>PHYSIOTHERAPY</option><option>DIETETICS</option><option>MASSAGE</option><option>HOME_VISIT</option></select></label><label>Lokalizacja<select name="location"><option>28 CZERWCA</option><option>SOWMED_KOSCIELNA</option><option>AMAZONKI</option><option>HOME</option></select></label><label>Usługa<input name="service" value="Initial consultation" required></label><label>Start<input name="start" type="datetime-local" value="2026-08-13T16:00" required></label><button>Utwórz wizytę</button></form><div class="result" id="result">Ready.</div></main><script>document.querySelector('#form').onsubmit=async(e)=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.target));const base='http://127.0.0.1:8789';const appointment=await fetch(base+'/api/appointments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());const audit=await fetch(base+'/api/audit-events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'CREATE_APPOINTMENT',resourceId:appointment.id,actor:'demo-gosia'})}).then(r=>r.json());document.querySelector('#result').textContent=JSON.stringify({appointment,audit},null,2)}</script></body></html>
