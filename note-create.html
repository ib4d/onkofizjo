<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · note</title><style>body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{max-width:700px;margin:auto;background:#fff;border:1px solid #d9d1c7;padding:28px}h1{font:42px Georgia,serif;color:#051a0f}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5}textarea{min-height:160px}button{margin-top:22px;background:#051a0f;color:#fff;border:0;padding:14px 18px;font-weight:700}.result{margin-top:18px;padding:15px;background:#f1ede9;white-space:pre-wrap}</style></head><body><main><span class="eyebrow">CRM · documentation</span><h1>Nota de visita</h1><p>La nota se crea como borrador y queda pendiente de revisión humana.</p><form id="form"><label>Patient ID<input name="patientId" value="demo-patient-anna-kowalska" required></label><label>Appointment ID<input name="appointmentId" value="appt-001" required></label><label>Author<input name="author" value="Gosia" required></label><label>Observation<textarea name="text" required>Synthetic demo note — verify before use.</textarea></label><button>Guardar borrador</button></form><div class="result" id="result">Ready.</div></main><script src="api-client.js"></script><script>document.querySelector('#form').onsubmit=async(e)=>{e.preventDefault();const result=document.querySelector('#result');result.textContent='Saving draft…';try{const payload=Object.fromEntries(new FormData(e.target));const r=await OnkofizjoApi.post('/api/notes',payload);result.textContent=JSON.stringify(r.data,null,2)}catch(error){result.textContent='Unable to save: '+error.message}}</script></body></html>
