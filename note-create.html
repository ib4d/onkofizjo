<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · note</title><style>*{box-sizing:border-box}body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{width:100%;max-width:700px;margin:auto;background:#fff;border:1px solid #d9d1c7;padding:28px}h1{font:42px Georgia,serif;color:#051a0f}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}label{display:block;font-weight:700;margin:18px 0 7px}input,select,textarea{display:block;width:100%;max-width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5;color:#1c1c19;font:16px Arial,sans-serif}textarea{min-height:160px;resize:vertical}button{margin-top:22px;background:#051a0f;color:#fff;border:0;padding:14px 18px;font-weight:700;cursor:pointer}.result{margin-top:18px;padding:15px;background:#f1ede9;white-space:pre-wrap;overflow-wrap:anywhere}.status{font-size:12px;color:#79564f;margin-top:8px}</style></head><body><main><span class="eyebrow">CRM · documentation</span><h1>Nota de visita</h1><p>Los pacientes y las citas se cargan desde el CRM. La nota queda asociada al contexto elegido.</p><div class="status" id="status">Cargando registros…</div><form id="form"><label>Patient<select name="patientId" id="patientId" required><option value="">Selecciona un paciente</option></select></label><label>Appointment<select name="appointmentId" id="appointmentId" required><option value="">Selecciona una cita</option></select></label><label>Author<select name="author" required><option value="Gosia">Gosia</option></select></label><label>Observation<textarea name="text" required>Synthetic demo note — verify before use.</textarea></label><button id="submit">Guardar borrador</button></form><div class="result" id="result">Ready.</div></main><script src="api-client.js"></script><script>(async function(){const status=document.querySelector('#status'),patient=document.querySelector('#patientId'),appointment=document.querySelector('#appointmentId'),requestedPatient=new URLSearchParams(location.search).get('patientId');try{const [patientsResponse,appointmentsResponse]=await Promise.all([OnkofizjoApi.get('/api/patients','data/demo-patients.json'),OnkofizjoApi.get('/api/appointments','data/demo-appointments.json')]);const patients=patientsResponse.data.patients||[];patients.forEach(item=>patient.add(new Option(item.name,item.id)));if(requestedPatient&&patients.some(item=>item.id===requestedPatient))patient.value=requestedPatient;const appointments=appointmentsResponse.data.appointments||[];const drawAppointments=()=>{appointment.innerHTML='<option value="">Selecciona una cita</option>';appointments.filter(item=>!patient.value||item.patientId===patient.value).forEach(item=>appointment.add(new Option(`${item.start?.slice(0,16).replace('T',' ')} · ${item.service} · ${item.id}`,item.id)))};patient.addEventListener('change',drawAppointments);drawAppointments();status.textContent='Registros cargados desde el API local.'}catch(error){status.textContent='No se pudieron cargar los registros. Inicia start-dev.cmd.';console.warn(error)}})();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const result=document.querySelector('#result'),button=document.querySelector('#submit');button.disabled=true;result.textContent='Guardando borrador…';try{const r=await OnkofizjoApi.post('/api/notes',Object.fromEntries(new FormData(e.target)));result.textContent=JSON.stringify(r.data,null,2)}catch(error){result.textContent='No se pudo guardar: la API local no está disponible.'}finally{button.disabled=false}}</script></body></html>
