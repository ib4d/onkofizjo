<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · note</title><style>*{box-sizing:border-box}body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{width:100%;max-width:700px;margin:auto;background:#fff;border:1px solid #d9d1c7;padding:28px}h1{font:42px Georgia,serif;color:#051a0f;margin:12px 0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}label{display:block;font-weight:700;margin:18px 0 7px}input,select,textarea{display:block;width:100%;max-width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5;color:#1c1c19;font:16px Arial,sans-serif;border-radius:0}textarea{min-height:160px;resize:vertical}button{margin-top:22px;background:#051a0f;color:#fff;border:0;padding:14px 18px;font-weight:700;cursor:pointer}.result{margin-top:18px;padding:15px;background:#f1ede9;white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:13px;color:#737973;line-height:1.5}.status{font-size:12px;color:#79564f;margin-top:8px}</style></head><body><main><span class="eyebrow">CRM · documentation</span><h1>Nota de visita</h1><p class="hint">Selecciona el paciente y la cita desde los registros del CRM. Los valores manuales no se utilizarán en producción.</p><div class="status" id="status">Cargando registros…</div><form id="form"><label>Patient<select name="patientId" id="patientId" required><option value="">Selecciona un paciente</option></select></label><label>Appointment<select name="appointmentId" id="appointmentId" required><option value="">Selecciona una cita</option></select></label><label>Author<select name="author" required><option value="Gosia">Gosia</option></select></label><label>Observation<textarea name="text" required>Synthetic demo note — verify before use.</textarea></label><button id="submit">Guardar borrador</button></form><div class="result" id="result">Ready.</div></main><script src="api-client.js"></script><script>(async function(){const status=document.querySelector('#status'),patient=document.querySelector('#patientId'),appointment=document.querySelector('#appointmentId');try{const [patients,appointments]=await Promise.all([OnkofizjoApi.get('/api/patients','data/demo-patient.json'),OnkofizjoApi.get('/api/appointments','data/demo-appointments.json')]);const p=patients.data;const patientsList=p.patients||[p];patientsList.forEach(item=>{const option=new Option(item.name||item.fullName||item.id,item.id);patient.add(option)});const a=appointments.data;const appointmentsList=a.appointments||[a];appointmentsList.forEach(item=>{const label=[item.date,item.time,item.service].filter(Boolean).join(' · ')||item.id;appointment.add(new Option(label,item.id))});status.textContent='Registros cargados desde '+(patients.source==='development-api'?'CRM local':'datos demo')}catch(error){status.textContent='No se pudieron cargar los registros. Inicia start-dev.cmd.';console.warn(error)}})();document.querySelector('#form').onsubmit=async(e)=>{e.preventDefault();const result=document.querySelector('#result'),button=document.querySelector('#submit');result.textContent='Guardando borrador…';button.disabled=true;try{const payload=Object.fromEntries(new FormData(e.target));const r=await OnkofizjoApi.post('/api/notes',payload);result.textContent=JSON.stringify(r.data,null,2)}catch(error){result.textContent='No se pudo guardar: la API local no está disponible. Ejecuta start-dev.cmd y vuelve a cargar la página.'}finally{button.disabled=false}}</script></body></html>
