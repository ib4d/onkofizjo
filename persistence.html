<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · persistence</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Literata:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg:#fdf9f5;--green:#051a0f;--ink:#1c1c19;--line:#d9d1c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;padding:48px}h1{font:48px Literata,Georgia,serif;color:var(--green);margin:12px 0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}.panel{max-width:760px;background:#fff;border:1px solid var(--line);padding:24px;margin-top:28px}.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 0}.value{color:var(--green);font-weight:700}.note{color:#424843;line-height:1.6;max-width:720px}.btn{background:var(--green);color:#fff;border:0;padding:12px 16px;margin-top:22px;font-weight:700}</style></head><body><span class="eyebrow">onkofizjo · data layer</span><h1>Un solo estado para todo el CRM.</h1><p class="note">Esta pantalla demuestra persistencia local segura. En producción será reemplazada por una API autenticada con base de datos y auditoría.</p><section class="panel" id="status">Loading…</section><button class="btn" id="reset">Reset demo data</button><script src="data-store.js"></script><script>(async()=>{const [patient,plan,ops]=await Promise.all([OnkofizjoStore.read('patient'),OnkofizjoStore.read('dietPlan'),OnkofizjoStore.read('operations')]);document.querySelector('#status').innerHTML=`<div class="row"><span>Session role</span><span class="value">${OnkofizjoStore.sessionRole()}</span></div><div class="row"><span>Patient record</span><span class="value">${patient.name}</span></div><div class="row"><span>Diet plan state</span><span class="value">${plan.status}</span></div><div class="row"><span>Documents loaded</span><span
