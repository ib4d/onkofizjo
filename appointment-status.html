<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · appointment status</title><style>body{margin:0;padding:42px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;background:#fff;border:1px solid #d9d1c7;padding:28px}h1{font:42px Georgia,serif;color:#051a0f}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#79564f}label{display:block;font-weight:700;margin:18px 0 7px}input,select{width:100%;padding:13px;border:1px solid #d9d1c7;background:#fdf9f5}button{margin-top:22px;background:#051a0f;color:#fff;border:0;padding:14px 18px;font-weight:700}.result{margin-top:18px;padding:15px;background:#f1ede9;white-space:pre-wrap;line-height:1.5}</style></head><body><main><span class="eyebrow">CRM · appointment lifecycle</span><h1>Estado de la visita</h1><p>Cada cambio debe quedar registrado y seguir los estados permitidos.</p><form id="form"><label>ID cita<input name="appointmentId" value="appt-001" required></label><label>Nuevo estado<select name="status"><option>SCHEDULED</option><option>CONFIRMED</option><option>TIME_BLOCKED</option><option>CANCELLED_BY_PATIENT</option><option>NO_SHOW</option><option>COMPLETED</option><option>VACATION</option><option>BLOCKED</option></select></label><button>Guardar estado</button></form><div class="result" id="result">Ready.</div></main><script>document.querySelector('#form').onsubmit=async(e)=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.target));const r=await fetch('http://127.0.0.1:8789/api/appointments/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
