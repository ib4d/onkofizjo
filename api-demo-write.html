<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>onkofizjo · controlled write</title><style>body{margin:0;padding:48px;background:#fdf9f5;color:#1c1c19;font-family:Arial,sans-serif}h1{font-family:Georgia,serif;color:#051a0f}.panel{max-width:680px;background:#fff;border:1px solid #d9d1c7;padding:24px}button{background:#051a0f;color:#fff;border:0;padding:13px 18px;font-weight:700}.result{margin-top:18px;padding:14px;background:#f1ede9;white-space:pre-wrap;line-height:1.5}</style></head><body><h1>Controlled diet draft</h1><p>Demo only. This action creates a proposal and an audit event; it cannot approve or send a plan.</p><div class="panel"><button id="create">Create assistant proposal</button><div class="result" id="result">Ready.</div></div><script>document.querySelector('#create').onclick=async()=>{const body={patientId:'demo-patient-anna-kowalska',strategy:'demo',requestedBy:'Gosia',reason:'prototype validation'};const plan=await fetch('http://127.0.0.1:8787/api/diet-plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());const audit=await fetch('http://127.0.0.1:8787/api/audit-events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'CREATE_DIET_PROPOSAL',resourceId:plan.id,actor:'demo-gosia'})}).then(r=>r.json());document.querySelector('#result').textContent=JSON.stringify({plan,audit},null,2)}</script></body></html>
